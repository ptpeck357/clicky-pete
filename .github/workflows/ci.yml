name: CI

on:
    push:
        branches: [prod]
    pull_request:
        branches: [dev, prod]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Run CI checks
              run: npm run ci
              # The public photo host, as Amplify sets it; not a secret, since it ships in the
              # bundle. The build fails without it: prerender.mjs rejects an index.html that
              # still holds the %VITE_CLOUDFRONT_URL% placeholder.
              env:
                  VITE_CLOUDFRONT_URL: https://photos.clickypete.photography
