customHeaders:
    - pattern: '**'
      headers:
          # Everything loads from this origin except photos (CloudFront), analytics and the
          # contact endpoint. Each host below is one the app actually calls — verified against
          # the built bundle, not guessed.
          - key: Content-Security-Policy
            value: >-
                default-src 'self';
                img-src 'self' data: blob: https://photos.clickypete.photography;
                connect-src 'self' https://photos.clickypete.photography
                https://20w109iwsh.execute-api.us-west-2.amazonaws.com
                https://www.google-analytics.com https://*.google-analytics.com
                https://*.analytics.google.com https://*.googletagmanager.com;
                script-src 'self' https://www.googletagmanager.com;
                style-src 'self' 'unsafe-inline';
                font-src 'self' data:;
                object-src 'none';
                base-uri 'self';
                form-action 'self';
                frame-ancestors 'none';
                upgrade-insecure-requests
          - key: X-Content-Type-Options
            value: nosniff
          - key: Referrer-Policy
            value: strict-origin-when-cross-origin
          - key: Permissions-Policy
            value: camera=(), microphone=(), geolocation=(), interest-cohort=()
          - key: Strict-Transport-Security
            value: max-age=31536000; includeSubDomains
