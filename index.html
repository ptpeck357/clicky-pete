<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />

		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
		<link rel="shortcut icon" href="/favicon.ico" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/manifest.json" />
		<meta name="theme-color" content="#4165af" />

		<!-- photos.json and every image come from this host, and nothing can start until the
		     manifest arrives. The fetch is a CORS request and the <img> loads are not, and a browser
		     keeps those on separate connections, so each needs its own preconnect. -->
		<link rel="preconnect" href="%VITE_CLOUDFRONT_URL%" crossorigin />
		<link rel="preconnect" href="%VITE_CLOUDFRONT_URL%" />

		<script src="/theme-init.js"></script>

		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Clicky Pete Photography</title>
	</head>

	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
